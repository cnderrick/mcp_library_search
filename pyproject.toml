[project]
name = "mcp_library_search"
version = "0.1.0"
description = "MCP server for finding books in city library systems (Shanghai supported; more cities coming)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["fastmcp>=2.0"]

[project.scripts]
mcp_library_search = "mcp_library_search.server:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_library_search"]

[tool.pytest.ini_options]
testpaths = ["tests"]
