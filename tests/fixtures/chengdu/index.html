	//是否有馆藏选择
	function holdingFilterSearch() {
		var checker = $("#holdingChecker:checked").val();
		if(checker&&checker=='1'){
			document.location.href = "/opac/search?&hasholding=1";
		}else{
			document.location.href = "/opac/search?";
		}

	}
	$(document).ready(function(){
		// 原始字符串
		var resourceStr = "";
		if(resourceStr==null || resourceStr == ''){resourceStr = "/opac/media/css/aiSupport.css,/opac/media/js/common/aiSupport.js";}
		// 分割字符串为数组
		var resources = resourceStr.split(',');

		// 遍历资源数组
		$.each(resources, function(index, url) {
			// 判断资源类型（JS/CSS）
			if (url.endsWith('.js')) {
				// 动态创建script标签
				var script = document.createElement('script');
				script.src = url+'?v='+Date.now();
				script.async = false; // 保证按顺序加载
				$('body').append(script);
			} else if (url.endsWith('.css')) {
				// 动态创建link标签
				var link = document.createElement('link');
				link.rel = 'stylesheet';
				link.type = 'text/css';
				link.href = url+'?v='+Date.now();
				$('head').append(link);
			}
		});
		//检查是否登录
		
		$(".loginBtn").bind("click",function(){
			$("#loginFrame").attr("src",'/opac/reader/login?loginFlag=dialog');
		});
		$(".loginBtn").click(function(){
			$(".loginPopArea").show();
			$('html,body').addClass('overHide');
		});
		$(".popDel").bind("click",function(){
			$('#rdPasswd').val("");
			$("#loginmsg").html("");
			$(".loginPopArea").hide();
			$('html,body').removeClass('overHide');
		});
		
		
		
		
		
		


		
	});

	function changeSearchWay(op){
		$("#searchWay").val(op);
	}
	function searchByHotKeyword(hotSearchKeyword) {
		$("#q").val(hotSearchKeyword);
		$('#allLib').val('');
		$("#searchForm").submit();
	}
	function search(view) {
		$("#view").val(view);
		var qword = $("#q").val();
		if(qword!=""&&bannedHashSet.contains(qword)){
			alert("您的检索词中包含不当词汇，请更换或删除敏感词");
			return;
		}
		$('#allLib').val('');
		$("#searchForm").submit();
	}
	//高级搜索
	function gotoAdvancedSearch() {
		document.location.href = '/opac/index/advance';
	}
</script>

		/**
		 * 去除url参数串中的某个参数
		 * @param urlParams 原url参数，如：libcode=001&hasholding=1&searchWay=title
		 * @param paramKey 要去除的参数名，如：libcode
		 * @returns {string|*} 去除libcode之后的参数串，如：hasholding=1&searchWay=title
		 */
		function delParam(urlParams,paramKey){
			var arr = new Array();
			if (urlParams != "") {
				var urlParamArr = urlParams.split("&"); //将参数按照&符分成数组
				for (var i = 0; i < urlParamArr.length; i++) {
					var paramArr = urlParamArr[i].split("="); //将参数键，值拆开
					//如果键雨要删除的不一致，则加入到参数中
					if (paramArr[0] != paramKey) {
						arr.push(urlParamArr[i]);
					}
				}
			}
			if (arr.length > 0) {
				return arr.join("&");
			}
			return urlParams;
		}
