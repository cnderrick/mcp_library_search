<script type="text/javascript">
	function applyClick(bookLib,id){
		var item = $('input[@name=take_loca_'+bookLib+'][@checked]').val(); 
		var itemnull = $('#take_loca_null').val();
		
		if(itemnull != undefined && itemnull != ""){
			if(item == undefined || item == "")
				item = itemnull;
		}
		
		if( item == undefined || item == "" ){
				alert('请先选择取书地!');
				return;
		}
		
		var data = "book_lib=" + bookLib + "&call_no=" + $("#call_no_" + bookLib).val() + "&take_loca=" 
				   	+ item + "&id=" + id + "&time=" + new Date().getTime();
		if($("#attachment").val() == "on")
			data = data + "&attachment=1";
			//alert(data);
		if(confirm('确定申请此书?')){
			$.ajax({
			   type: "get",
			   url: "prelend.action",
			   data: data,
			   success: function(msg){		   
			     alert( msg.replace(/^\s+|\s+$/g,""));
			   }
			 });
	    }		
	}
</script>
