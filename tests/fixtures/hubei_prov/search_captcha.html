        },
        ready : function() {  //加载完毕的回调
        },
        success : function(params) { //成功的回调
            verification(params.captchaVerification);
        },
        error : function() {        //失败的回调
        }
    });

    function verification(captchaVerification) {
        $.ajax({
            type:"post",
            data:{
                "captchaVerification":captchaVerification
            },
            url:"/opac/captcha/verification;jsessionid=F1502116EE0C7D9C688DD258C0B15B53",
            success:function(result){
                if(result.code == 200){
                    layer.alert('验证成功，等待页面跳转')
                    if(window.location.pathname.indexOf("/captcha/")>-1){
                        window.location.href="/opac/;jsessionid=F1502116EE0C7D9C688DD258C0B15B53";
                    }else{
                        window.location.reload();
                    }
                }else{
                    layer.alert(result.msg)
                }
            }
        });
    }
</script>
