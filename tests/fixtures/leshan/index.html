<script>
	$(document).ready(function(){
		//检查是否登录
		
		$(".loginBtn").bind("click",function(){
			$("#loginFrame").attr("src",'/opac/reader/login;jsessionid=6A050AB091B07123E792E87A6AC2DC4B?loginFlag=dialog');
		});
		$(".loginBtn").click(function(){
			$(".loginPopArea").show();
			$('html,body').addClass('overHide');
		});
		$(".popDel").bind("click",function(){
			$('#rdPasswd').val("");
			$("#loginmsg").html("");
			$(".loginPopArea").hide();
			$('html,body').removeClass('overHide');
		});
		
		
		
			
			
		

		
	});

	function changeSearchWay(op){
		$("#searchWay").val(op);
	}
	function searchByHotKeyword(hotSearchKeyword) {
		$("#q").val(hotSearchKeyword);
		$('#allLib').val('');
		$("#searchForm").submit();
	}

	function search(view) {
		if(view=="search_result_iframe"){
			alert("系统建设中");
		}else{
			$("#view").val(view);
			var qword = $("#q").val();
			if(qword!=""&&bannedHashSet.contains(qword)){
				alert("您的检索词中包含不当词汇，请更换或删除敏感词");
				return;
			}
			$('#allLib').val('');
			$("#searchForm").submit();
		}
	}
	//高级搜索
	function gotoAdvancedSearch() {
		document.location.href = '/opac/index/advance;jsessionid=6A050AB091B07123E792E87A6AC2DC4B';
	}
</script>
